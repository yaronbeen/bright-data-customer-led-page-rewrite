[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bright-data-customer-led-page-rewrite"
version = "0.1.0"
description = "Evidence-linked page rewrite suggestions constrained to approved product facts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yaron Been"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
customer-led-page-rewrite = "customer_led_page_rewrite.cli:main"

[tool.setuptools]
packages = ["customer_led_page_rewrite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
